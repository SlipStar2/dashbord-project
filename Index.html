/* СТРАЖ ЗАПУСКА: если страница не запускается, причина показывается на экране, а не прячется за надписью «загрузка…» */
(function () {
  var g = window.__guard = { complete: false, banner: function (title, text) {
    var d = document.getElementById('guard') || document.createElement('div'); d.id = 'guard';
    d.style.cssText = 'position:fixed;left:12px;right:12px;top:12px;z-index:99;background:#2a1212;color:#ffd9d4;border:1px solid #ff5a5a;border-radius:12px;padding:12px 16px;font:14px/1.5 system-ui,sans-serif';
    d.innerHTML = '<b>' + title + '</b><br>' + text; (document.body || document.documentElement).appendChild(d); } };
  var tip = 'Чаще всего файл Index.html вставлен в Apps Script не полностью. Проверьте, что он заканчивается строкой &lt;/html&gt;, вставьте файл заново и создайте НОВУЮ версию развёртывания.';
  window.addEventListener('error', function (e) { if (!g.complete) g.banner('Страница не запустилась', 'Ошибка: ' + (e.message || 'неизвестная') + (e.lineno ? ' (строка ' + e.lineno + ')' : '') + '. ' + tip); });
  setTimeout(function () { if (!g.complete) g.banner('Скрипт страницы не запустился за 5 секунд', tip); }, 5000);
})();
</script>

.wcov{width:104px;height:104px;border-radius:16px;flex:none;background:linear-gradient(135deg,#2B190F,#14171C) center/cover;display:grid;place-items:center;font:700 40px Geologica,sans-serif;color:var(--acc)}
.wmeta{flex:1;min-width:0}.covtools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.covtools input[type=text]{flex:1;min-width:180px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:400 15px "Golos Text",sans-serif;padding:8px 12px}
.filebtn{cursor:pointer;display:inline-block}.inl{max-width:none;border:0;padding:0;background:none;margin:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.kpi small{display:block;color:var(--mut)}.kpi b{display:block;font:700 30px/1.1 Geologica,sans-serif;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.agrid .wide{grid-column:1/-1}.agrid .span2{grid-column:span 2}
.dwrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut{width:132px;height:132px;border-radius:50%;position:relative;display:grid;place-items:center;flex:none;text-align:center}
.donut::after{content:"";position:absolute;inset:17px;border-radius:50%;background:var(--card)}
.donut span{position:relative;z-index:1;font:700 17px/1.15 Geologica,sans-serif;display:block;max-width:90px}.donut small{display:block;font:400 11px "Golos Text",sans-serif;color:var(--mut)}
.leg{flex:1;min-width:120px}.leg div{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13px}.leg i{width:10px;height:10px;border-radius:3px;flex:none}.leg b{margin-left:auto;font-weight:600}
.bars{display:flex;gap:10px;height:180px}.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}.bw{flex:1;width:100%;display:flex;align-items:flex-end}
.bb{width:100%;background:#2D3442;border-radius:6px 6px 0 0}.bb.now{background:var(--acc)}.bcol small{font-size:11px;color:var(--mut);white-space:nowrap}
.tbl{overflow-x:auto}.tr{display:grid;grid-template-columns:var(--cols);gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);min-width:560px}.tr.thd{border-top:0;color:var(--mut);font-size:12px}
.tr .lk{background:none;border:0;color:var(--ink);font:inherit;text-align:left;cursor:pointer;padding:0;text-decoration:underline;text-decoration-color:var(--line)}.over{color:#FF8A6B}
.tip{display:block;width:100%;padding:9px 0;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer}.sw.on{border-color:#fff}
@media (max-width:900px){.split{grid-template-columns:1fr}#pl{position:static;max-height:none}.kpis{grid-template-columns:repeat(2,1fr)}.agrid{grid-template-columns:1fr}.agrid .span2{grid-column:auto}.whead{flex-direction:column;align-items:flex-start}}
.md p{margin:8px 0}.row .t small{margin-bottom:2px}.c h2 .b{margin-left:auto}

</style>
